# Tests every push and pull request. On main (or a manual run), also builds the server image
# and pushes it to Docker Hub as :latest and :sha-<commit>.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME  your Docker Hub username
#   DOCKERHUB_TOKEN     a Docker Hub access token with Read & Write scope
# Optional variable or secret:
#   DOCKERHUB_REPO      e.g. yourname/feeddoctor (default <username>/feeddoctor)
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # rebuild and push the image by hand from the Actions tab

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: feeddoctor
          POSTGRES_PASSWORD: feeddoctor
          POSTGRES_DB: feeddoctor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U feeddoctor"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FEEDDOCTOR_TEST_DATABASE_URL: postgres://feeddoctor:feeddoctor@localhost:5432/feeddoctor_test
      FEEDDOCTOR_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -count=1 -p 1 ./...

  image:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # DOCKERHUB_REPO may be a variable or a secret; without either the
      # image goes to <username>/feeddoctor. With no Docker Hub login set up
      # at all the job does nothing, so CI stays green.
      - id: repo
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_REPO: ${{ vars.DOCKERHUB_REPO || secrets.DOCKERHUB_REPO }}
        run: |
          if [ -z "$HUB_USER" ]; then
            echo "::notice::DOCKERHUB_USERNAME is not set, skipping the image push"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          repo="${HUB_REPO:-$HUB_USER/feeddoctor}"
          echo "name=$(echo "$repo" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - if: steps.repo.outputs.skip != 'true'
        uses: actions/checkout@v4
      - if: steps.repo.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.repo.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: steps.repo.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.repo.outputs.name }}:latest
            ${{ steps.repo.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
